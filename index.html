<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game is never over</title>
<link rel="stylesheet" href="style.css?v=portrait-brow-scar-v2">
<script>
  if (new URLSearchParams(location.search).has('portrait')) {
    document.documentElement.classList.add('portrait-preview');
  }
</script>
<body>
<main>
  <div class="scene" aria-busy="true">
    <picture>
      <source class="portrait-artwork">
      <img class="artwork" src="previews/head-seedance-first-frame.png" width="1920" height="1080" alt="Героиня сидит на кровати в комнате за стеклом во лбу. Рядом два чёрных демона." fetchpriority="high" draggable="false">
    </picture>
    <video class="reaction" id="cry" src="previews/head-cry-seedance.mp4" preload="auto" muted playsinline aria-hidden="true" hidden></video>
    <video class="reaction" id="face" src="previews/head-squint-seedance.mp4" preload="auto" muted playsinline aria-hidden="true" hidden></video>
    <div class="room-window room-window-full">
      <video class="room" id="room" data-prealigned="true" src="previews/pet-cycle-matched.mp4" preload="auto" muted playsinline aria-hidden="true"></video>
      <img class="room-static" src="previews/pet-room-anchor.png" alt="" aria-hidden="true">
      <video class="room right-preview" id="room-right" src="previews/right-pet-preview.mp4" preload="auto" muted playsinline aria-hidden="true" hidden></video>
      <video class="room right-preview" id="room-right-destroy" src="previews/right-destroy-preview.mp4" preload="auto" muted playsinline aria-hidden="true" hidden></video>
      <video class="room" id="room-destroy" src="previews/left-destroy-v2.mp4" preload="auto" muted playsinline aria-hidden="true" hidden></video>
      <img class="right-pet-bottom" src="previews/pet-room-anchor.png" alt="" aria-hidden="true">
    </div>
    <img class="glass-overlay" src="previews/glass-outer-seam.png" alt="" aria-hidden="true">
    <div class="left-demon-actions" role="group" aria-label="Левый демон">
      <button class="pet-target" type="button" aria-label="Погладить левого демона" disabled>to pet</button>
      <button id="cry-trigger" type="button" aria-label="Уничтожить левого демона" disabled>to destroy</button>
    </div>
    <div class="left-demon-actions right-demon-actions" role="group" aria-label="Правый демон">
      <button id="pet-right" type="button" aria-label="Погладить правого демона" disabled>to pet</button>
      <button id="destroy-right" type="button" aria-label="Уничтожить правого демона" disabled>to destroy</button>
    </div>
  </div>
  <div class="loading" role="status"><span id="status">Загрузка…</span><button id="retry" type="button" hidden>Попробовать ещё раз</button></div>
</main>
